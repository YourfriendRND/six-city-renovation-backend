version: '3.8'

services:
  storage_service:
    container_name: six_city_storage_service
    build:
      context: .
      dockerfile: ./apps/storage-service/Dockerfile
    depends_on:
      minio:
        condition: service_started
      minio_bucket_creator:
        condition: service_started
    ports:
      - "${STORAGE_PORT}:${STORAGE_PORT}"
    networks:
      - six-city-network
    restart: unless-stopped

  core_service:
    container_name: six_city_core_service
    build:
      context: .
      dockerfile: ./apps/core-service/Dockerfile
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_started
    ports:
      - "${CORE_PORT}:${CORE_PORT}"
    networks:
      - six-city-network
    restart: unless-stopped

  api_service:
    container_name: six_city_api_service
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - ${GATEWAY_PORT}:${GATEWAY_PORT}
    networks:
      - six-city-network
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: six_city_minio
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    networks:
      - six-city-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT}/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    
  minio_bucket_creator:
    container_name: six_city_minio_bucket_creator
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - six-city-network
    entrypoint: >
      /bin/sh -c " 
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} && \
      mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME} && \
      mc admin accesskey create myminio/ --access-key ${MINIO_ACCESS_KEY} --secret-key ${MINIO_SECRET_KEY} && \
      exec sleep inf; "

  rabbitmq:
    container_name: six_city_rabbitmq
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-password}
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_ADMIN_PORT}:${RABBITMQ_ADMIN_PORT}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - six-city-network
    restart: unless-stopped

  redis:
    container_name: six_city_redis
    image: redis:7.2-alpine
    command: redis-server --port ${REDIS_PORT} --requirepass ${REDIS_PASSWORD}
    volumes:
      - six_city_redis:/data
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    restart: always
    networks:
      - six-city-network
  
  postgres:
    container_name: six_city_postgres
    image: postgres:14
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-six-city}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - six-city-network
  
  pg_admin:
    container_name: six_city_pg_admin
    image: dpage/pgadmin4:8.9
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-postgres}
    ports:
      - '${PGADMIN_PUBLIC_PORT}:80'
    volumes:
      - pgadmin:/var/lib/pgadmin
    restart: always
    depends_on:
      postgres:
        condition: service_started
    networks:
      - six-city-network

volumes:
  minio_data:
  rabbitmq_data:
  six_city_redis:
  postgres_data:
  pgadmin:

networks:
  six-city-network:
    name: six-city-network
    driver: bridge
